# Yachay agent-kit CI standard.
#
# Nothing deploys without passing tests here first. This workflow only
# installs and tests; it never deploys.
#
# A macOS self-hosted runner is registered for jobs that need it: swap the
# `runs-on` line below for the commented one.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # the marketplace action for gitleaks requires a paid license for organizations; run the binary directly.
      - name: Run gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --exit-code 1

  test:
    runs-on: ubuntu-latest
    # runs-on: [self-hosted, macOS, macmini]  # use for jobs that need macOS
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke check (no pytest suite found)
        run: python -m compileall .
